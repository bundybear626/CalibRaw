name: Fork release

# Publishes the Windows installers that "Build Windows" made for a push to
# the bundybear branch as release v<version>-bb<N> on this fork. CalibRaw's
# update check in this fork reads this repository's latest release.
# v1.5.0-bb1 is newer than an installed 1.4.0 and older than 1.5.0, so the
# check offers each new upstream version once.
on:
  workflow_run:
    workflows: ["Build Windows"]
    types: [completed]
    branches: [bundybear]

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the built commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: downloaded-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"

          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name '*-setup.exe' -o -name 'CalibRaw-windows-*.zip' \) \
            -exec cp {} release-assets/ \;
          ls -l release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4

          build=1
          while gh release view "v$version-bb$build" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            build=$((build + 1))
          done
          tag="v$version-bb$build"

          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "CalibRaw $version (bundybear build $build)" \
            --notes "CalibRaw $version from Duecki1/CalibRaw with this fork's changes: photos passed on the command line (digiKam \"Open With\") open in the editor, and Windows lists CalibRaw under \"Open with\" for RAW and image files. Install CalibRaw-windows-x86_64-setup.exe on a normal PC."
